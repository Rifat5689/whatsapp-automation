name: Deploy backend to Azure production

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy backend
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      AZURE_WEBAPP_NAME: whatsapp-automations

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test --workspace backend

      - name: Package backend
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="${RUNNER_TEMP}/backend-${GITHUB_SHA::7}.zip"
          (
            cd backend
            zip -q -r "$ARTIFACT" package.json src
          )
          test "$(zipinfo -1 "$ARTIFACT" | grep -c '^package.json$')" -eq 1
          if zipinfo -1 "$ARTIFACT" | grep -Eq '(^|/)(\.env($|\.)|node_modules/|tests/|uploads/)|(^|/)(credentials|config)\.json$'; then
            echo 'Deployment ZIP contains a prohibited file.' >&2
            exit 1
          fi
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B4A3AFC2356F418B9967A00F75A991BF }}
          package: ${{ env.ARTIFACT }}

      - name: Verify health
        shell: bash
        env:
          WEBAPP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            "${WEBAPP_URL%/}/api/v1/health" | jq -e '.status == "ok" and .database == "connected"'
